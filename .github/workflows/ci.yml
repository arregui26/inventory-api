name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: LocalDemo_Only!Passw0rd2026
        ports: [1433:1433]
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalDemo_Only!Passw0rd2026' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval=5s --health-timeout=5s --health-retries=30 --health-start-period=30s
    env:
      API_KEY: test-inventory-not-a-real-secret-1234567890
      TEST_SQLSERVER_CONNECTION_STRING: Server=localhost,1433;Database=InventoryCiTests;User Id=sa;Password=LocalDemo_Only!Passw0rd2026;Encrypt=True;TrustServerCertificate=True
      ConnectionStrings__Inventory: Server=localhost,1433;Database=InventoryCiTests;User Id=sa;Password=LocalDemo_Only!Passw0rd2026;Encrypt=True;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Inventory.slnx --locked-mode
      - run: dotnet build Inventory.slnx -c Release --no-restore
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/Inventory.Api --configuration Release --no-build
      - run: dotnet test Inventory.slnx -c Release --no-build
      - run: docker build -t inventory-api:ci .
