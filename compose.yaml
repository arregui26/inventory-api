name: inventory-api
x-app: &app
  image: inventory-api:local
  build: .
  environment:
    API_KEY: ${API_KEY:?Copy .env.example to .env first}
    ConnectionStrings__Inventory: Server=db,1433;Database=InventoryDemo;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set local database password};Encrypt=True;TrustServerCertificate=True
    ASPNETCORE_ENVIRONMENT: Production
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set local database password}
    ports: ["127.0.0.1:14311:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    mem_limit: 3g
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  migrate:
    <<: *app
    command: ["--migrate"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:8011:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  sql-data:
